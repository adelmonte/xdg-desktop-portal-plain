[package]
name = "xdg-desktop-portal-plain"
version = "0.1.0"
edition = "2024"
description = "A toolkit-free xdg-desktop-portal backend: settings, app chooser, notifications, inhibit, access prompts in a terminal"
license = "GPL-3.0-or-later"

[dependencies]
zbus  = { version = "5.12", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "process", "fs", "signal", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
toml  = "0.8"
nix   = { version = "0.30.1", features = ["signal", "user"] }
inotify = "0.11"
futures-util = { version = "0.3", default-features = false }

[profile.release]
lto = "thin"
