# xdg-desktop-portal-plain: copy to ~/.config/xdg-desktop-portal-plain/config.toml
# Reread whenever it's saved; `xdg-desktop-portal-plain --check` shows what it gives.

# Where questions (permissions, which app to open a file with) are asked.
# The prompt command is added to the end.
terminal = ["kitty", "--class", "xdg-desktop-portal-plain",
            "-o", "remember_window_size=no",
            "-o", "initial_window_width=72c", "-o", "initial_window_height=20c"]

[appearance]
color-scheme = "prefer-dark"     # prefer-dark, prefer-light or default
# accent-color = "#88c0d0"
contrast = "normal"              # normal or high
reduced-motion = "no-preference" # no-preference or reduce

[lockdown]
# disable-location = true

